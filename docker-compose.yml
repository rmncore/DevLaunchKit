services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: launchkit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "launchkit"]
      interval: 2s
      timeout: 3s
      retries: 15

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/launchkit
      DEVLAUNCHKIT_ADMIN_DEMO: ${DEVLAUNCHKIT_ADMIN_DEMO:-false}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:3000}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
